<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SaaS Chatbot Test Arayüzü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #chat-container::-webkit-scrollbar {
            width: 6px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background-color: #a0aec0;
            border-radius: 20px;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        details > summary {
            list-style: none;
        }
        details > summary::-webkit-details-marker {
            display: none;
        }
        details[open] summary .arrow-down {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-gray-200">

    <!-- Ana Çerçeve -->
    <div class="w-full max-w-lg mx-auto h-full flex flex-col bg-white shadow-lg sm:rounded-2xl sm:my-4 sm:h-[calc(100vh-2rem)] sm:max-h-[800px]">
        
        <!-- Header -->
        <header class="bg-gray-800 text-white p-4 flex items-center justify-between shadow-md z-10 flex-shrink-0">
            <div>
                <h1 class="text-xl font-bold">Mantarinyo Destek</h1>
                <p class="text-sm text-gray-300">NLU Chatbot</p>
            </div>
            <div class="relative">
                <div class="w-3.5 h-3.5 bg-green-400 rounded-full animate-pulse border-2 border-gray-700"></div>
            </div>
        </header>

        <!-- Ayarlar Bölümü (Katlanabilir) -->
        <details class="bg-gray-50 border-b border-gray-200 flex-shrink-0">
            <summary class="p-3 cursor-pointer font-medium text-gray-700 list-none flex justify-between items-center">
                <span>Gelişmiş Ayarlar</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-down transition-transform arrow-down" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
                </svg>
            </summary>
            <div class="p-4 pt-0">
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="flex-1">
                        <label for="tenantId" class="block text-xs font-medium text-gray-600 mb-1">Tenant ID</label>
                        <input type="number" id="tenantId" value="1" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div class="flex-1">
                        <label for="sessionId" class="block text-xs font-medium text-gray-600 mb-1">Session ID</label>
                        <div class="flex gap-2">
                            <input type="text" id="sessionId" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 bg-gray-100" readonly>
                            <button id="newSessionBtn" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-75 transition-colors">Yeni</button>
                        </div>
                    </div>
                </div>
            </div>
        </details>

        <!-- Sohbet Mesajları -->
        <main id="chat-container" class="flex-1 p-4 sm:p-6 overflow-y-auto bg-gray-100">
            <div class="space-y-6" id="message-list">
                <!-- Bot Karşılama Mesajı -->
                <div class="flex items-start gap-3">
                    <div class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-white font-bold text-lg flex-shrink-0">B</div>
                    <div class="bg-gray-200 text-gray-800 p-3 rounded-lg rounded-tl-none max-w-xs sm:max-w-md">
                        <p class="font-medium text-sm text-gray-900">Mantarinyo Bot</p>
                        <p class="text-md">${default_responses.greeting || "Merhaba! Size nasıl yardımcı olabilirim?"}</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Mesaj Giriş Alanı -->
        <footer class="p-3 bg-white border-t border-gray-200 flex-shrink-0">
            <form id="chat-form" class="flex items-center gap-2">
                <input type="text" id="message-input" placeholder="Bir mesaj yazın..." class="flex-1 w-full px-4 py-3 border border-gray-300 rounded-full focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" autocomplete="off">
                <button type="submit" id="send-button" class="w-12 h-12 bg-indigo-600 text-white font-semibold rounded-full shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-75 transition-all disabled:bg-gray-400 disabled:scale-95 flex items-center justify-center flex-shrink-0">
                     <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </footer>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const messageList = document.getElementById('message-list');
        const chatContainer = document.getElementById('chat-container');
        const tenantIdInput = document.getElementById('tenantId');
        const sessionIdInput = document.getElementById('sessionId');
        const newSessionBtn = document.getElementById('newSessionBtn');
        const sendButton = document.getElementById('send-button');

        const API_URL = 'http://localhost:8000/process_query/';

        const createNewSession = () => {
            const newId = `web-session-${Date.now()}-${Math.random().toString(36).substring(2, 8)}`;
            sessionIdInput.value = newId;
        };

        const addMessage = (sender, message, isUser = false) => {
            const messageDiv = document.createElement('div');
            message = message.replace(/\n/g, '<br>'); // Yeni satırları HTML'e çevir
            if (isUser) {
                messageDiv.className = 'flex items-start gap-3 justify-end';
                messageDiv.innerHTML = `
                    <div class="bg-indigo-600 text-white p-3 rounded-lg rounded-br-none max-w-xs sm:max-w-md">
                        <p class="text-md">${message}</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center text-white font-bold text-lg flex-shrink-0">S</div>
                `;
            } else {
                messageDiv.className = 'flex items-start gap-3';
                messageDiv.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-white font-bold text-lg flex-shrink-0">B</div>
                    <div class="bg-gray-200 text-gray-800 p-3 rounded-lg rounded-tl-none max-w-xs sm:max-w-md">
                        <p class="font-medium text-sm text-gray-900">${sender}</p>
                        <p class="text-md">${message}</p>
                    </div>
                `;
            }
            messageList.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };

        const showLoadingIndicator = () => {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loading-indicator';
            loadingDiv.className = 'flex items-start gap-3';
            loadingDiv.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-white font-bold text-lg flex-shrink-0">B</div>
                <div class="bg-gray-200 text-gray-800 p-4 rounded-lg rounded-tl-none max-w-xs sm:max-w-md flex items-center space-x-2">
                    <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: -0.3s;"></div>
                    <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: -0.15s;"></div>
                    <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce"></div>
                </div>
            `;
            messageList.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };

        const removeLoadingIndicator = () => {
            const loadingIndicator = document.getElementById('loading-indicator');
            if (loadingIndicator) {
                loadingIndicator.remove();
            }
        };

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = messageInput.value.trim();
            if (!query) return;

            const tenantId = tenantIdInput.value;
            const sessionId = sessionIdInput.value;

            if (!tenantId || !sessionId) {
                alert('Lütfen Tenant ID ve Session ID alanlarını doldurun.');
                return;
            }

            addMessage('Siz', query, true);
            messageInput.value = '';
            sendButton.disabled = true;
            showLoadingIndicator();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'accept': 'application/json'
                    },
                    body: JSON.stringify({
                        query,
                        tenant_id: parseInt(tenantId),
                        session_id: sessionId
                    })
                });

                removeLoadingIndicator();

                if (!response.ok) {
                    const errorData = await response.json();
                    const errorMessage = errorData.detail || 'Bilinmeyen bir sunucu hatası oluştu.';
                    addMessage('Hata', `Sunucu Hatası: ${errorMessage}`);
                    return;
                }

                const data = await response.json();
                const botResponse = data.bot_response || "Üzgünüm, bir yanıt alamadım.";
                addMessage('Mantarinyo Bot', botResponse);

            } catch (error) {
                removeLoadingIndicator();
                addMessage('Hata', 'API ile iletişim kurulamadı. Sunucunun çalıştığından emin olun.');
                console.error('API Hatası:', error);
            } finally {
                sendButton.disabled = false;
                messageInput.focus();
            }
        });

        newSessionBtn.addEventListener('click', () => {
             createNewSession();
             messageList.innerHTML = `
                <div class="flex items-start gap-3">
                    <div class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-white font-bold text-lg flex-shrink-0">B</div>
                    <div class="bg-gray-200 text-gray-800 p-3 rounded-lg rounded-tl-none max-w-xs sm:max-w-md">
                        <p class="font-medium text-sm text-gray-900">Mantarinyo Bot</p>
                        <p class="text-md">Yeni bir sohbet oturumu başlatıldı. Size nasıl yardımcı olabilirim?</p>
                    </div>
                </div>
             `;
        });

        window.addEventListener('load', createNewSession);
    </script>
</body>
</html>
